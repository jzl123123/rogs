# Paths are relative to this file, or absolute after environment expansion.
# Algorithm values mirror upstream local_nusc.yaml; save=True is an output-only change.
seed: 17
device: cuda:0
output: ../outputs
dataset:
  dataset: NuscDataset
  version: trainval
  base_dir: ${NUSC_ROOT}
  image_dir: ${NUSC_SEG_ROOT}
  road_gt_dir: ${NUSC_GROUND_ROOT}
  replace_name: false
  clip_list: [scene-0655]
  min_distance: 0.2
  image_width: 800
  image_height: 450
  camera_names: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]
train:
  vis: false
  debug_from: -1
  detect_anomaly: false
  start_checkpoint: ""
  eval: true
  save: true
model:
  bev_resolution: 0.05
  cut_range: 8
  sh_degree: 3
  use_rgb: true
  use_label: true
  opt_xy: false
  white_background: false
  use_exposure: true
optimization:
  epochs: 2
  random_background: false
  position_lr_init: 0.000016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  percent_dense: 0.01
  feature_lr: 0.0005
  opacity_lr: 0.0001
  scaling_lr: 0.0001
  rotation_lr: 0.0001
  rgb_lr: 0.008
  label_lr: 0.1
  exposure_lr: 0.001
  seg_loss_weight: 0.06
  smooth_loss_weight: 0.003
  depth_loss_weight: 0
  z_weight: 0
pipeline:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false

